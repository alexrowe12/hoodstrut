name: Bug report
description: Report reproducible incorrect behavior in hoodstrut
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Remove API keys, MCP credentials, repository credentials, and proprietary source before submitting.
  - type: textarea
    id: description
    attributes:
      label: Problem
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest safe sequence of commands and fixture that reproduces the issue.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Hoodstrut version
      placeholder: Output of hoodstrut --version
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, architecture, Node, npm, Git, and Docker versions as relevant.
    validations:
      required: true
  - type: textarea
    id: metadata
    attributes:
      label: Reproducibility metadata
      description: Include sanitized runner build hash, image ID, repository commit, and artifact paths when available.
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed credentials and sensitive repository content from this report.
          required: true
        - label: This is not a security vulnerability requiring private disclosure.
          required: true
